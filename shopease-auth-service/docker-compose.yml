services:

  auth-mysql:
    image: mysql:8.0
    container_name: shopease-auth-mysql
    restart: unless-stopped

    env_file:
      - .env.docker

    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}

    ports:
      - "3308:3306"

    volumes:
      - shopease_auth_mysql_data:/var/lib/mysql

    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u${MYSQL_USER}",
          "-p${MYSQL_PASSWORD}"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s


  auth-service:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: shopease-auth-service
    restart: unless-stopped

    env_file:
      - .env.docker

    ports:
      - "8002:8002"

    depends_on:
      auth-mysql:
        condition: service_healthy


volumes:
  shopease_auth_mysql_data: